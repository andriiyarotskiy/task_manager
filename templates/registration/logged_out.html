{% extends "base.html" %}
{% block title %}
  Logged out
{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h1 class="h4 mb-3">You have been logged out</h1>
          <p class="text-muted mb-4">
            Your session has ended. You can log in again to continue working with your projects and tasks.
          </p>
          <a href="{% url 'login' %}" class="btn btn-primary">
            Go to login page
          </a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
