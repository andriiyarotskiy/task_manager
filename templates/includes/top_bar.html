<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="/">Task Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
      <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
        {% if user.is_authenticated %}
          <li class="nav-item me-3">
            <span class="navbar-text small text-light">
              Logged in as
              <span class="fw-semibold">
                {{ user.first_name }} {{ user.last_name }}{% if not user.first_name and not user.last_name %}
                {{ user.username }}{% endif %}
              </span>
            </span>
          </li>
          <li class="nav-item">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">
                Logout
              </button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">
              Login
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
